name: Publish Docker image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: build-and-push (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # :latest — сборка без build-args (умолчания из кода, /tools/erd2)
          - name: default
            tag: latest
            build_args: ''
          # :erd-root — корень /tools/erd, лендинг открыт для индексации
          - name: erd-root
            tag: erd-root
            build_args: |
              VITE_APP_BASE=/tools/erd
              VITE_ABOUT_INDEXABLE=true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/erd-editor2:${{ matrix.tag }}
            ghcr.io/${{ env.OWNER_LC }}/erd-editor2:${{ matrix.name == 'default' && 'sha' || 'erd-root-sha' }}-${{ github.sha }}
