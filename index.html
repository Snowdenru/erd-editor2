<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, max-image-preview:large" />
        <title>SQL Lab - ERD редактор баз данных</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Шрифт не должен блокировать первый рендер: грузим с media=print и переключаем после загрузки -->
        <link
            href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
            media="print"
            onload="this.media = 'all'"
        />
        <noscript>
            <link
                href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
                rel="stylesheet"
            />
        </noscript>
        <style>
            /* Заставка до старта React: без неё пользователь видит белый экран, пока грузится бандл */
            .app-splash {
                display: flex;
                height: 100vh;
                align-items: center;
                justify-content: center;
                background: #fff;
            }
            .app-splash > span {
                width: 40px;
                height: 40px;
                border: 4px solid #fbcfe8;
                border-top-color: #db2777;
                border-radius: 50%;
                animation: app-splash-spin 0.8s linear infinite;
            }
            @media (prefers-color-scheme: dark) {
                .app-splash {
                    background: #020817;
                }
                .app-splash > span {
                    border-color: #4a1d36;
                    border-top-color: #ec4899;
                }
            }
            @keyframes app-splash-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
        <script src="/config.js"></script>
        <script>
            // Load analytics only if not disabled
            (function () {
                const disableAnalytics =
                    (window.env && window.env.DISABLE_ANALYTICS === 'true') ||
                    (typeof process !== 'undefined' &&
                        process.env &&
                        process.env.VITE_DISABLE_ANALYTICS === 'true');

                if (!disableAnalytics) {
                    const script = document.createElement('script');
                    script.src = 'https://cdn.usefathom.com/script.js';
                    script.setAttribute('data-site', 'PRHIVBNN');
                    script.setAttribute('data-canonical', 'false');
                    script.setAttribute('data-spa', 'auto');
                    script.defer = true;
                    document.head.appendChild(script);
                }
            })();
        </script>
    </head>
    <body>
        <div id="root">
            <div class="app-splash"><span></span></div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
