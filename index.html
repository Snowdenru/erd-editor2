<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SQL Lab - ERD редактор баз данных</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Шрифт не должен блокировать первый рендер: грузим с media=print и переключаем после загрузки -->
        <link
            href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
            media="print"
            onload="this.media = 'all'"
        />
        <noscript>
            <link
                href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
                rel="stylesheet"
            />
        </noscript>
        <style>
            /* Заставка до старта React: без неё пользователь видит белый экран, пока грузится бандл */
            .app-splash {
                display: flex;
                height: 100vh;
                align-items: center;
                justify-content: center;
                background: #fff;
            }
            .app-splash > span {
                width: 40px;
                height: 40px;
                border: 4px solid #fbcfe8;
                border-top-color: #db2777;
                border-radius: 50%;
                animation: app-splash-spin 0.8s linear infinite;
            }
            @media (prefers-color-scheme: dark) {
                .app-splash {
                    background: #020817;
                }
                .app-splash > span {
                    border-color: #4a1d36;
                    border-top-color: #ec4899;
                }
            }
            @keyframes app-splash-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
        <script src="/config.js"></script>
        <script id="erd2-entry">
            // Возвращающегося пользователя с корня приложения ведём в последнюю схему до отрисовки
            // лендинга. У бота и нового посетителя маркера нет — они видят лендинг.
            (function () {
                try {
                    if (window.__ERD2_PRERENDER__) return;
                    if (location.pathname.replace(/\/+$/, '') !== '/tools/erd2')
                        return;
                    if (location.search) return;
                    var id = localStorage.getItem('erd2_last_diagram');
                    if (id && /^[A-Za-z0-9_-]+$/.test(id)) {
                        // replace только начинает навигацию: пока грузится схема, лендинг
                        // продолжил бы рисоваться и слать аналитику. Прячем страницу и
                        // выключаем счётчики (window.stop() не используем — может отменить переход).
                        window.__ERD2_REDIRECTING__ = true;
                        // Следующий документ увидит referrer /tools/erd2/ — помечаем сессию,
                        // чтобы трекинг не принял редирект за переход с лендинга.
                        try {
                            sessionStorage.setItem('erd2_entry_redirect', '1');
                        } catch (e) {
                            // приватный режим — источник останется неточным, редирект важнее
                        }
                        document.documentElement.style.visibility = 'hidden';
                        location.replace('/tools/erd2/d/' + id);
                        // Страховка: если переход не состоялся (отмена, ошибка сети) или
                        // страница вернулась из bfcache — не оставляем пользователя с пустым экраном.
                        var restore = function () {
                            document.documentElement.style.visibility = '';
                            window.__ERD2_REDIRECTING__ = false;
                        };
                        window.setTimeout(restore, 5000);
                        window.addEventListener('pageshow', function (event) {
                            if (event.persisted) restore();
                        });
                    }
                } catch (e) {
                    // localStorage недоступен — остаёмся на лендинге
                }
            })();
        </script>
        <script>
            // Load analytics only if not disabled
            (function () {
                const disableAnalytics =
                    (window.env && window.env.DISABLE_ANALYTICS === 'true') ||
                    (typeof process !== 'undefined' &&
                        process.env &&
                        process.env.VITE_DISABLE_ANALYTICS === 'true');

                // При предрендере (scripts/prerender-about.mjs) счётчик не грузим:
                // ни визит со сборки, ни тег в сохранённом about.html не нужны.
                // Флаг erd2_no_track=1 в localStorage — выключатель для smoke и ручных проверок.
                var noTrack = false;
                try {
                    noTrack = localStorage.getItem('erd2_no_track') === '1';
                } catch (e) {
                    // localStorage недоступен — обычный режим
                }
                if (
                    !disableAnalytics &&
                    !noTrack &&
                    !window.__ERD2_PRERENDER__ &&
                    !window.__ERD2_REDIRECTING__
                ) {
                    const script = document.createElement('script');
                    script.src = 'https://cdn.usefathom.com/script.js';
                    script.setAttribute('data-site', 'PRHIVBNN');
                    script.setAttribute('data-canonical', 'false');
                    script.setAttribute('data-spa', 'auto');
                    script.defer = true;
                    document.head.appendChild(script);
                }
            })();
        </script>
    </head>
    <body>
        <div id="root">
            <div class="app-splash"><span></span></div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
